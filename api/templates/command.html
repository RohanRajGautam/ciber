<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://fonts.googleapis.com/css?family=Fira+Mono' rel='stylesheet' type='text/css'>
  <title>Test</title>
</head>
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-color: #000;
  }

  .console {
    font-family: 'Fira Mono';
    /* width: 700px; */
    /* height: 450px; */
    box-sizing: border-box;
    margin: auto;
    margin-top: 0;
  }

  .console header {
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
    background-color: #555;
    height: 45px;
    line-height: 45px;
    text-align: center;
    color: #DDD;
  }

  .console .consolebody {
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
    box-sizing: border-box;
    padding: 20px;
    /* height: calc(100% - 40px); */
    overflow: scroll;
    background-color: #000;
    color: rgb(183, 183, 183);
    scroll-behavior: smooth; /* <-- for smooth scroll */
    overflow-x: hidden;
  }

  .console .consolebody p {
    line-height: 1.5rem;
  }

  /* .console .consolebody p pre{
    width: 100vw;
  } */

  .try-again {
    text-align: center;
    font-family: 'Fira Mono';
    color: #00b786;
  }

  .try-again a {
    text-decoration: none;
    color: rgb(165, 99, 13);
  }
  
    /* width */
  ::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }

  /* Track */
  ::-webkit-scrollbar-track {
    background: #000;
  }

  /* Handle */
  ::-webkit-scrollbar-thumb {
    background: rgb(183, 183, 183);
  }

</style>
<body>
    <div class="console" >
      <!-- <header>
        <p>testing for vulnerabilities</p>
      </header> -->
      <div class="consolebody" id="timelog">
        {% for item in rows %}
          <pre>{{ item }}</pre>
        {% endfor %}
      </div>
    </div>

    <h4 class="try-again"><a href="/form">Try again</a> with another url?</h4>

    <script>
      var elem = document.getElementById('timelog');
      elem.scrollTop = elem.scrollHeight;
    </script>
  </body>
</html>
